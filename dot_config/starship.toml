"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$nodejs\
$java\
$gradle\
$kotlin\
$python\
$ruby\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
stashed = ""
deleted = "✘${count}"
style = "bold red"

[git_state]
style = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold green"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[java]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold red"
detect_extensions = ["java", "class", "jar", "gradle", "kts"]

[gradle]
format = "[$symbol($version)]($style) "
style = "bold cyan"

[kotlin]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold blue"

[python]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold yellow"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[ruby]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold red"
detect_files = ["Gemfile", ".ruby-version"]

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold orange"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "bold blue"
only_with_files = true

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
