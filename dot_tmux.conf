# Change prefix to Ctrl+A (easier than Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Vim keys to navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Gruvbox dark theme
set -g status-position bottom
set -g status-style 'bg=#282828 fg=#ebdbb2'
set -g status-left '#[bg=#458588,fg=#282828,bold]  #S #[bg=#282828,fg=#458588]'
set -g status-left-length 30
set -g status-right '#[fg=#665c54]#[bg=#665c54,fg=#ebdbb2] %H:%M #[bg=#458588,fg=#282828,bold] %d-%b-%Y '
set -g window-status-format '#[fg=#665c54] #I:#W '
set -g window-status-current-format '#[fg=#fabd2f,bold] #I:#W '
set -g window-status-separator ''
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#fabd2f'
set -g message-style 'bg=#458588 fg=#282828 bold'

# Vi mode for copy
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Don't rename windows automatically
set -g allow-rename off

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Focus events (needed for vim/neovim autoread)
set -g focus-events on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM (must be last)
run '~/.tmux/plugins/tpm/tpm'
